services:
  mysql:
    image: mysql:8.0
    container_name: flood_rescue_mysql
    restart: unless-stopped
    environment:
      # ⚠️ Chỉ dùng cấu hình này cho môi trường local development.
      # Trên staging/production hãy override bằng biến môi trường an toàn hơn.
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flood_rescue
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - flood_rescue_data:/var/lib/mysql
      - ./src/main/resources/database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --sql-mode=NO_AUTO_VALUE_ON_ZERO
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  flood_rescue_data:
    driver: local
