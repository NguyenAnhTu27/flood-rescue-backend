# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# DATASOURCE (MySQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flood_rescue?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONNECTION POOL (Hikari - default)
# ===============================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}

# ===============================
# JWT
# ===============================
app.jwt.secret=${APP_JWT_SECRET:change-this-secret-key}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ===============================
# SEED DATA
# ===============================
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.coordinator.email=${APP_SEED_COORDINATOR_EMAIL:}
app.seed.coordinator.phone=${APP_SEED_COORDINATOR_PHONE:}
app.seed.coordinator.password=${APP_SEED_COORDINATOR_PASSWORD:}
app.seed.coordinator.full-name=${APP_SEED_COORDINATOR_FULL_NAME:}

app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin.phone=${APP_SEED_ADMIN_PHONE:}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.admin.full-name=${APP_SEED_ADMIN_FULL_NAME:}

# ===============================
# UPLOAD
# ===============================
app.upload.rescue-dir=${APP_UPLOAD_RESCUE_DIR:uploads/rescue}
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# ===============================
# FILE SIZE
# ===============================
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:20MB}