server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flood_rescue?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

app.jwt.secret=${APP_JWT_SECRET:change-this-to-a-long-random-secret-key}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.coordinator.email=${APP_SEED_COORDINATOR_EMAIL:coordinator@example.com}
app.seed.coordinator.phone=${APP_SEED_COORDINATOR_PHONE:0900000002}
app.seed.coordinator.password=${APP_SEED_COORDINATOR_PASSWORD:ChangeMe123!}
app.seed.coordinator.full-name=${APP_SEED_COORDINATOR_FULL_NAME:Coordinator}

app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@example.com}
app.seed.admin.phone=${APP_SEED_ADMIN_PHONE:0900000001}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:ChangeMe123!}
app.seed.admin.full-name=${APP_SEED_ADMIN_FULL_NAME:Admin}

app.upload.rescue-dir=${APP_UPLOAD_RESCUE_DIR:uploads/rescue}
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB