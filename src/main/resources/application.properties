# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# DATASOURCE (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flood_rescue}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
# Disable in production to avoid leaking SQL in logs
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# CONNECTION POOL (Hikari - default)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# JWT — Use a cryptographically random 256-bit secret
# Generate: openssl rand -hex 32
# Set APP_JWT_SECRET environment variable in production!
app.jwt.secret=${APP_JWT_SECRET:f9e8c4b2a1d7e6f5g4h3i2j1k9l8m7n6p5q4r3s2t1u}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Login rate limit (anti brute-force)
app.auth.login-rate-limit.max-attempts=5
app.auth.login-rate-limit.window-seconds=900
app.auth.login-rate-limit.block-seconds=900
app.auth.login-rate-limit.max-tracked-keys=10000

# ===============================
# SEED DATA (DEV)
# ===============================
# Set to false in production! Or use APP_SEED_ENABLED=false env var.
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.coordinator.email=coordinator@gmail.com
app.seed.coordinator.phone=0900000002
app.seed.coordinator.password=Coordinator123
app.seed.coordinator.full-name=coordinator

# Default admin account (for local/dev demo)
app.seed.admin.email=admin@gmail.com
app.seed.admin.phone=0900000001
app.seed.admin.password=Admin123
app.seed.admin.full-name=admin

# Default manager account (for local/dev demo)
app.seed.manager.email=manager@gmail.com
app.seed.manager.phone=0900000003
app.seed.manager.password=Manager123
app.seed.manager.full-name=mg1

# Default team accounts (for local/dev demo - RESCUER role)
# Team 1
app.seed.team1.phone=0910000001
app.seed.team1.email=team1@gmail.com
app.seed.team1.password=Team123
app.seed.team1.full-name=rs1
# Team 2
app.seed.team2.phone=0910000002
app.seed.team2.email=team2@gmail.com
app.seed.team2.password=Team123
app.seed.team2.full-name=rs2

# ===============================
# UPLOAD
# ===============================
app.upload.rescue-dir=uploads/rescue
app.upload.rescue-public-prefix=/uploads/rescue
# Expose local uploads directory under /uploads/**
spring.web.resources.static-locations=classpath:/static/,file:uploads/

#size picture
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# ENCRYPTION (for email & phone fields)
# Set APP_ENCRYPTION_SECRET environment variable in production!
# ===============================
app.encryption.secret=${APP_ENCRYPTION_SECRET:c7a3f1b9d4e8h2k6m0p5s8v1x4z7a0c3}

# ===============================
# MAPBOX
# ===============================
mapbox.access-token=${MAPBOX_ACCESS_TOKEN:your-mapbox-access-token-here}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=http://localhost:5173

# ===============================
# LOGGING (SECURITY DEBUG)
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.floodrescue.config.security=DEBUG

# ===============================
# CACHE
# ===============================
spring.cache.type=simple

# ===============================
# ACTUATOR / OBSERVABILITY
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=flood-rescue-backend

# ===============================
# RESILIENCE4J (MAPBOX)
# ===============================
resilience4j.retry.instances.mapboxGeocoding.max-attempts=3
resilience4j.retry.instances.mapboxGeocoding.wait-duration=500ms
resilience4j.retry.instances.mapboxGeocoding.retry-exceptions=org.springframework.web.client.RestClientException,java.io.IOException
resilience4j.circuitbreaker.instances.mapboxGeocoding.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mapboxGeocoding.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.mapboxGeocoding.sliding-window-size=10
resilience4j.circuitbreaker.instances.mapboxGeocoding.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.mapboxGeocoding.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.mapboxGeocoding.permitted-number-of-calls-in-half-open-state=3
